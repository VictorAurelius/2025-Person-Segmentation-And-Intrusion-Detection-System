# Configuration for NIGHT conditions
# Optimized for night-time with night-vision effect
# Use with: data/input/input-01-night.mp4 (generated by lighting_simulator.py)

# Video Input
video:
  source: "data/input/input-01-night.mp4"
  fps: 30

# Motion Detection
# Night: Very sensitive settings due to low light and high noise
# High history to build better background model
motion:
  method: "MOG2"
  history: 700
  threshold: 12
  detect_shadows: false  # Shadows not reliable in night vision

# Adaptive Thresholding
# Night: Large block size for extreme low contrast
# High C value to handle noise
threshold:
  method: "gaussian"
  block_size: 19
  C: 6

# Edge Detection
# Night: Very low thresholds for low contrast conditions
edge:
  method: "canny"
  low_threshold: 20
  high_threshold: 70

# Morphology
# Night: Aggressive morphological operations to handle noise
# Larger kernel and more iterations
morphology:
  kernel_size: 9
  iterations: 4

# Intrusion Detection
# Night: More lenient thresholds due to detection challenges
# Lower area requirement as objects may be harder to detect
intrusion:
  roi_file: "data/roi/restricted_area.json"
  overlap_threshold: 0.20
  time_threshold: 1.5
  min_object_area: 1000

# Alert
alert:
  visual: true
  audio: true
  log_file: "data/output/input-01-night/alerts.log"
  save_screenshots: true

# Output
output:
  save_video: true
  output_path: "data/output/input-01-night/result-night.mp4"
  show_realtime: true
