# Configuration for LOW-LIGHT conditions
# Optimized for dusk, cloudy weather, or indoor lighting
# Use with: data/input/input-01-low-light.mp4 (generated by lighting_simulator.py)

# Video Input
video:
  source: "data/input/input-01-low-light.mp4"
  fps: 30

# Motion Detection
# Low-light: Reduced threshold for better sensitivity
# Increased history to handle noise better
motion:
  method: "MOG2"
  history: 600
  threshold: 16
  detect_shadows: true

# Adaptive Thresholding
# Low-light: Larger block size for better local adaptation
# Increased C to compensate for low contrast
threshold:
  method: "gaussian"
  block_size: 15
  C: 4

# Edge Detection
# Low-light: Lower thresholds to detect edges in low contrast
edge:
  method: "canny"
  low_threshold: 30
  high_threshold: 100

# Morphology
# Low-light: More iterations to reduce noise
# Slightly larger kernel to close gaps
morphology:
  kernel_size: 7
  iterations: 3

# Intrusion Detection
# Low-light: Slightly lower area threshold
# May need to be more lenient with overlap due to noise
intrusion:
  roi_file: "data/roi/restricted_area.json"
  overlap_threshold: 0.25
  time_threshold: 1.0
  min_object_area: 1200

# Alert
alert:
  visual: true
  audio: true
  log_file: "data/output/input-01-lowlight/alerts.log"
  save_screenshots: true

# Output
output:
  save_video: true
  output_path: "data/output/input-01-lowlight/result-lowlight.mp4"
  show_realtime: true
